# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "David Bandana Jusu"
title_separator          : "-"
name                     : &name "David Bandana Jusu"
description              : &description "MSc Business Informatics Portfolio"
url                      : "https://davidbjusu.github.io"
baseurl                  : ""
repository               : "davidbjusu/davidbjusu.github.io"

# Site Author Settings
author:
  # Biographic information
  avatar           : "profile1.png"
  name             : "David Bandana Jusu"
  bio              : "MSc Business Informatics Student & Aspiring Data Scientist"
  location         : "Debrecen, Hungary"
  employer         : "University of Debrecen"
  uri              : "https://davidbjusu.github.io"
  email            : "davidjusu218@mailbox.unideb.hu" 

  # Repositories and software development
  github           : "davidbjusu"
  kaggle           : # Add your kaggle username if you make one later

  # Social and Professional Networking links
  linkedin         : "davidbjusu" # Replace with your exact LinkedIn username suffix if different

# Publication Category (Kept default for template layout stability)
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Interface Elements
teaser                   :  
breadcrumbs              : false 
words_per_minute         : 160
future                   : true
read_more                : "disabled" 
talkmap_link             : false      

comments:
  provider               : "false"

atom_feed:
  hide                   : false     
  path                   : 

# SEO Verification Placeholders
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing Configurations
twitter:
  username               : 
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : og-image.png   
og_description           :  

social:
  type                   : "Person"
  name                   : "David Bandana Jusu"
  links: 

# Analytics Engines
analytics:
  provider               :  "false" 

# Directory Compilation Layout Rules
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown Compiler Configurations
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Active Academic Content Layout Streams
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Component Fallback Enforcements
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
